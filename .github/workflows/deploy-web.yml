name: deploy-web

# Builds website/ and deploys it to Cloudflare Pages (project "bunmaska",
# which serves bunmaska.org) on pushes that touch the site. Repo secrets:
#   CLOUDFLARE_API_TOKEN   — scoped token (Pages Edit + DNS Edit + Zone Read)
#   CLOUDFLARE_ACCOUNT_ID  — 33b4bb12637807398ca2edac6c77fe8c
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          # The IndexNow step diffs against the previous push; a shallow clone
          # would silently see no changes on a multi-commit push.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      # The site is held to the same bar as the framework: biome (ts/tsx) +
      # `astro check` (strict tsconfig over every .astro/.ts) gate the deploy.
      - name: Install framework dev tools (biome)
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Lint + format-check the site code
        run: bunx biome ci website/src
        working-directory: .

      - name: Type-check the site
        run: bun run check

      - name: Build the site
        env:
          # Lets the build-time star-count fetch use the authenticated rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run build

      # Run wrangler via bunx (the wrangler-action's npm install is flaky on Bun).
      # wrangler reads the token + account id from the env below.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 pages deploy dist --project-name=bunmaska --branch=main

      # IndexNow: tell Bing (and Yandex, Naver, Seznam, Amazon, and the AI
      # surfaces riding Bing's index) which pages changed. Google does not
      # participate; the sitemap covers it. Only URLs whose source changed are
      # sent; pushing the whole sitemap on every deploy is the protocol's
      # documented anti-pattern. Key file lives in public/.
      - name: Ping IndexNow with the URLs whose source changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          KEY=$(ls dist | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            git diff --name-only "$BEFORE" HEAD > /tmp/changed.txt
          else
            # Manual dispatch or an unknown base: treat it as a site-wide change.
            echo "website/src/layouts/Base.astro" > /tmp/changed.txt
          fi
          python3 scripts/indexnow-urls.py dist < /tmp/changed.txt > /tmp/urls.txt
          COUNT=$(wc -l < /tmp/urls.txt | tr -d ' ')
          if [ "$COUNT" = "0" ]; then
            echo "IndexNow: no page content changed, skipping the ping"
            exit 0
          fi
          python3 - "$KEY" <<'PY' > /tmp/indexnow.json
          import json, sys
          key = sys.argv[1]
          urls = open('/tmp/urls.txt').read().split()
          print(json.dumps({'host': 'bunmaska.org', 'key': key, 'keyLocation': f'https://bunmaska.org/{key}.txt', 'urlList': urls}))
          PY
          curl -s -w "IndexNow HTTP %{http_code} ($COUNT urls)\n" -o /dev/null \
            -X POST -H "Content-Type: application/json" \
            --data @/tmp/indexnow.json https://api.indexnow.org/indexnow
