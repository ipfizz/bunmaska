name: deploy-web

# Checks website/ on pull requests; on main also deploys it to Cloudflare Pages
# (project "bunmaska") and pings IndexNow. Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    # package.json carries the version the site shows.
    paths: ['website/**', 'package.json', '.github/workflows/deploy-web.yml']
  pull_request:
    branches: [main]
    paths: ['website/**', 'package.json', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

# Queue instead of racing, so two quick pushes deploy in push order.
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The IndexNow step diffs against the previous push; a shallow clone
          # would silently see no changes on a multi-commit push.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      # The site is held to the same bar as the framework: biome (ts/tsx) +
      # `astro check` (strict tsconfig over every .astro/.ts) gate the deploy.
      - name: Install framework dev tools (biome)
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Lint + format-check the site code
        run: bunx biome ci website/src
        working-directory: .

      - name: Type-check the site
        run: bun run check

      - name: Build the site
        env:
          # Lets the build-time star-count fetch use the authenticated rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run build

      # Run wrangler via bunx (the wrangler-action's npm install is flaky on Bun),
      # pinned exactly because the deploy token is in its env.
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4.143.0 pages deploy dist --project-name=bunmaska --branch=main

      # Only URLs whose source changed: pinging the whole sitemap on every deploy
      # is IndexNow's documented anti-pattern. The key file lives in public/.
      - name: Ping IndexNow with the URLs whose source changed
        if: github.event_name != 'pull_request'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          KEY=$(ls dist | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            git diff --name-only "$BEFORE" HEAD > /tmp/changed.txt
          else
            # Manual dispatch or an unknown base: treat it as a site-wide change.
            echo "website/src/layouts/Base.astro" > /tmp/changed.txt
          fi
          python3 scripts/indexnow-urls.py dist < /tmp/changed.txt > /tmp/urls.txt
          COUNT=$(wc -l < /tmp/urls.txt | tr -d ' ')
          if [ "$COUNT" = "0" ]; then
            echo "IndexNow: no page content changed, skipping the ping"
            exit 0
          fi
          python3 - "$KEY" <<'PY' > /tmp/indexnow.json
          import json, sys
          key = sys.argv[1]
          urls = open('/tmp/urls.txt').read().split()
          print(json.dumps({'host': 'bunmaska.org', 'key': key, 'keyLocation': f'https://bunmaska.org/{key}.txt', 'urlList': urls}))
          PY
          curl -s -w "IndexNow HTTP %{http_code} ($COUNT urls)\n" -o /dev/null \
            -X POST -H "Content-Type: application/json" \
            --data @/tmp/indexnow.json https://api.indexnow.org/indexnow
