[install]
exact = true

[test]
# Coverage (`test:coverage`) measures src logic: tests and FFI declaration tables excluded.
coverageSkipTestFiles = true
# `**/` is required: bun's glob `*` does not cross `/`, so a bare `*-ffi.ts`
# would match nothing (every FFI file lives under src/main/platform/*/).
coveragePathIgnorePatterns = ["**/*-ffi.ts"]
